<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090D"/>
      <stop offset="0.55" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="100" y1="260" x2="1500" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="strokeFadeL" x1="200" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.30"/>
      <stop offset="1" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glowL1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1420 90) rotate(135) scale(420)">
      <stop stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 480) rotate(-40) scale(460)">
      <stop stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridL" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.03"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="1600" height="520" rx="36" fill="url(#bgL)"/>
  <rect width="1600" height="520" rx="36" fill="url(#gridL)"/>
  <rect width="1600" height="520" rx="36" fill="url(#glowL1)"/>
  <rect width="1600" height="520" rx="36" fill="url(#glowL2)"/>
  <rect x="34" y="34" width="1532" height="452" rx="28" stroke="url(#edgeL)" stroke-opacity="0.30"/>
  <rect x="52" y="52" width="1496" height="416" rx="24" stroke="url(#strokeFadeL)" stroke-opacity="0.18"/>

  <!-- header -->
  <g font-family="JetBrains Mono, monospace">
    <text x="80" y="98" font-size="12" letter-spacing="3" fill="#64748B">LATENCY / CRITICAL PATH / 002</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="80" y="140" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">What can happen before this finishes?</text>
  </g>

  <!-- main pipeline line -->
  <path d="M110 262H1490" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M110 262H1490" stroke="url(#edgeL)" stroke-width="2" opacity="0.55"/>

  <!-- node dots + labels (alternating above line) -->
  <!-- 0 user stops speaking -->
  <circle cx="110" cy="262" r="7" fill="#05070A" stroke="#22D3EE" stroke-width="3"/>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#E2E8F0">
    <text x="110" y="234" text-anchor="middle">USER STOPS</text>
    <text x="110" y="250" text-anchor="middle">SPEAKING</text>
  </g>

  <!-- 1 endpoint/vad -->
  <circle cx="340" cy="262" r="6" fill="#0B0F14" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="340" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">ENDPOINT / VAD</text>

  <!-- 2 asr -->
  <circle cx="570" cy="262" r="6" fill="#0B0F14" stroke="#94A3B8" stroke-width="2.5"/>
  <text x="570" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">ASR</text>

  <!-- 3 llm first token (key node) -->
  <circle cx="800" cy="262" r="8" fill="#05070A" stroke="#8B5CF6" stroke-width="3"/>
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <text x="800" y="290" text-anchor="middle" fill="#F8FAFC" font-weight="700">LLM FIRST TOKEN</text>
  </g>

  <!-- tool execution branch (parallel path, dips below) -->
  <path d="M800 262C800 262 840 360 950 360C1040 360 1050 262 1050 262" stroke="#60A5FA" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity="0.75"/>
  <rect x="880" y="336" width="140" height="48" rx="12" fill="#0B0F14" stroke="#60A5FA" stroke-opacity="0.45"/>
  <text x="950" y="356" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="#64748B">PARALLEL</text>
  <text x="950" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#93C5FD" font-weight="700">TOOL EXECUTION</text>

  <!-- 4 llm continuation -->
  <circle cx="1050" cy="262" r="6" fill="#0B0F14" stroke="#94A3B8" stroke-width="2.5"/>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">
    <text x="1050" y="234" text-anchor="middle">LLM</text>
    <text x="1050" y="250" text-anchor="middle">CONTINUATION</text>
  </g>

  <!-- 5 tts first audio (key node) -->
  <circle cx="1280" cy="262" r="8" fill="#05070A" stroke="#22D3EE" stroke-width="3"/>
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <text x="1280" y="290" text-anchor="middle" fill="#F8FAFC" font-weight="700">TTS FIRST AUDIO</text>
  </g>

  <!-- 6 playback -->
  <circle cx="1490" cy="262" r="7" fill="#05070A" stroke="#22D3EE" stroke-width="3"/>
  <text x="1450" y="240" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#E2E8F0">PLAYBACK</text>

  <!-- metric brackets below -->
  <g font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">
    <!-- TTFT -->
    <path d="M110 410H800" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrowViolet)"/>
    <text x="110" y="430" fill="#C4B5FD">TTFT — time to first token</text>

    <!-- TTFA -->
    <path d="M110 452H1280" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="110" y="472" fill="#67E8F9">TTFA — time to first audio</text>
  </g>

  <!-- E2E full span, right aligned tag -->
  <rect x="1300" y="392" width="190" height="88" rx="16" fill="#0B0F14" stroke="#60A5FA" stroke-opacity="0.35"/>
  <text x="1324" y="420" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#64748B">E2E</text>
  <text x="1324" y="444" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">End-to-end</text>
  <text x="1324" y="462" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">latency</text>
</svg>
