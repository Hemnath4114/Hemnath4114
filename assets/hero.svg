    <text x="322" y="320" font-size="24" font-weight="500" fill="#D8D8DA">Still the fastest way to turn intent into action —</text>
    <text x="322" y="354" font-size="24" font-weight="500" fill="#D8D8DA">until something faster ships, that's what I build for.</text>
  </g>

